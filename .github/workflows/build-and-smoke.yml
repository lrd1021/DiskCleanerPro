name: Build and Smoke Test

# R15: 将冒烟工程接入 CI。每次推送到主分支或开 PR 时：
#   1) 还原并构建整个 solution（含 DiskCleaner + DiskCleaner.Elevated + DiskCleaner.SmokeTest）
#   2) 运行无头冒烟测试（DiskCleaner.SmokeTest，exit code 0 = 全通过）
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DiskCleanerPro.sln

      - name: Build (Release)
        run: dotnet build DiskCleanerPro.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Smoke test (headless)
        # 冒烟测试是控制台程序，Environment.Exit(0/1) 直接决定 CI 成败
        run: dotnet run --project src/DiskCleaner.SmokeTest --configuration Release

      - name: Publish self-contained (Release)
        # 主程序与提权助手分别发布到同一输出目录，确保 DiskCleaner.Elevated.exe
        # 也是自包含（干净目标机即使未装 .NET 8 也能启动，P1 打包项）。
        run: |
          dotnet publish src/DiskCleaner/DiskCleaner.csproj -c Release -r win-x64 --self-contained true -o ./publish
          dotnet publish src/DiskCleaner.Elevated/DiskCleaner.Elevated.csproj -c Release -r win-x64 --self-contained true -o ./publish

      - name: Verify publish artifacts
        shell: pwsh
        run: |
          if (Test-Path ./publish/*.pdb) {
            Write-Error "PDB files found in publish output"
            exit 1
          }
          $net6 = Get-ChildItem ./publish -Recurse | Where-Object { $_.Name -match 'net6\.0|net6-' }
          if ($net6) {
            Write-Error "net6.0 artifacts found in publish output: $($net6 -join ', ')"
            exit 1
          }
          if (-not (Test-Path ./publish/DiskCleaner.Elevated.exe)) {
            Write-Error "DiskCleaner.Elevated.exe missing from publish output"
            exit 1
          }
          $coreclr = Get-ChildItem ./publish -Recurse -Filter "coreclr.dll"
          if (-not $coreclr) {
            Write-Error "coreclr.dll missing - Elevated helper is NOT self-contained"
            exit 1
          }
          # 二次校验：runtimeconfig 中不应出现 framework 依赖（应为 includedFrameworks）
          $rtcfg = "./publish/DiskCleaner.Elevated.runtimeconfig.json"
          if (-not (Test-Path $rtcfg)) {
            Write-Error "DiskCleaner.Elevated.runtimeconfig.json missing from publish output"
            exit 1
          }
          $json = Get-Content $rtcfg -Raw | ConvertFrom-Json
          if ($json.runtimeOptions.framework) {
            Write-Error "Elevated helper runtimeconfig shows framework dependency (not self-contained)"
            exit 1
          }
          Write-Host "Publish OK: no PDB, no net6.0 artifacts, Elevated helper self-contained"

      - name: Sign binaries (Authenticode, GA gate)
        # 仅当仓库配置了 CODESIGN_PFX_BASE64 secret 才实际签名；常规 push 无证书时跳过。
        # 注意：step-level if 不能引用 secrets，故在脚本内判断。
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PASSWORD: ${{ secrets.CODESIGN_PASSWORD }}
          CODESIGN_TIMESTAMP_URL: ${{ vars.CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CODESIGN_PFX_BASE64)) {
            Write-Host "CODESIGN_PFX_BASE64 未配置，跳过 Authenticode 签名"
            exit 0
          }
          $ErrorActionPreference = 'Stop'
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_BASE64))
          $pw = ConvertTo-SecureString $env:CODESIGN_PASSWORD -AsPlainText -Force
          $cert = Get-PfxCertificate -FilePath $pfx -Password $pw
          $ts = if ($env:CODESIGN_TIMESTAMP_URL) { $env:CODESIGN_TIMESTAMP_URL } else { 'http://timestamp.digicert.com' }
          foreach ($exe in @('./publish/DiskCleanerPro.exe', './publish/DiskCleaner.Elevated.exe')) {
            Set-AuthenticodeSignature -FilePath $exe -Certificate $cert -TimestampServer $ts -HashAlgorithm SHA256
            Write-Host "Signed: $exe"
          }

      - name: Verify Authenticode signing (GA gate)
        # 分发前签名断言：常规 CI 未签名仅 warning；仓库设 vars.ENFORCE_SIGNING=true 时未签名即 fail。
        shell: pwsh
        env:
          ENFORCE_SIGNING: ${{ vars.ENFORCE_SIGNING || 'false' }}
        run: |
          $fail = $false
          foreach ($exe in @('./publish/DiskCleanerPro.exe', './publish/DiskCleaner.Elevated.exe')) {
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'Valid') {
              Write-Warning "未签名 (GA 前置): $exe -> $($sig.Status)"
              $fail = $true
            } else {
              Write-Host "Authenticode 有效: $exe"
            }
          }
          if ($fail) {
            if ($env:ENFORCE_SIGNING -eq 'true') {
              Write-Error "ENFORCE_SIGNING=true 但 exe 未签名，GA 门禁失败。分发前须运行 scripts/sign-binaries.ps1"
              exit 1
            }
            Write-Host "提示：分发前须运行 scripts/sign-binaries.ps1 完成 Authenticode 签名（GA 前置，常规 CI 不阻断）"
          }

      - name: Build installer (setup.exe)
        # 构建可分发安装包：publish + 准备 staging + NSIS 编译。
        # 用 -NoSign：CI 无代码签名证书，由目标机器安装时的 install-hook.ps1 在本机生成证书并签名。
        # NSIS 通过 Chocolatey 预装（windows-latest 自带 choco，比 SourceForge 直连稳）；
        # 若已存在则跳过，build-installer.ps1 检测到 makensis 在 PATH 即不再下载。
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress 2>&1 | Out-Null
            $env:PATH = "$env:ChocolateyInstall\bin;$env:PATH"
          }
          pwsh -ExecutionPolicy Bypass -File scripts/build-installer.ps1 -NoSign

      - name: Verify setup.exe
        run: |
          if (Test-Path ./DiskCleanerPro-Setup.exe) {
            Write-Host "setup.exe 已生成: $((Get-Item ./DiskCleanerPro-Setup.exe).Length) bytes"
          } else {
            Write-Error "DiskCleanerPro-Setup.exe 未生成"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskCleanerPro-Setup
          path: DiskCleanerPro-Setup.exe
          if-no-files-found: error
